name: CI/CD Frontend
on:
  push:
    branches: [ "main" ]
jobs:
  build:
    name: Build Docker image and push to repositories
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: true
        tags: marcosmartinez10/temperaturas-frontend:${{ github.sha }}

    - name: Deploy to EKS
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          kubectl set image deployment/temperaturas-frontend temperaturas-frontend=TUUSUARIODOCKERHUB/temperaturas-frontend:${{ github.sha }}