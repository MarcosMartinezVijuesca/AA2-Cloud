apiVersion: v1
kind: Service
metadata:
  name: temperaturas-frontend
  labels:
    app: frontend-temperaturas
spec:
  type: LoadBalancer
  ports:
    - port: 3001
  selector:
    app: frontend-temperaturas
    tier: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temperaturas-frontend
  labels:
    app: frontend-temperaturas
spec:
  selector:
    matchLabels:
      app: frontend-temperaturas
      tier: frontend
  template:
    metadata:
      labels:
        app: frontend-temperaturas
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: marcosmartinez10/temperaturas-frontend:latest
        ports:
        - containerPort: 3001
        env:
        - name: TEMP_SERVER
          value: "temperaturas-backend:5000"